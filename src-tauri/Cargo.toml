[package]
name = "foodmap"
version = "0.1.0"
description = "随食记 · foodprint — local-first food journal map"
authors = ["Lucian W. (lucian-d-w)"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.98"
# The desktop application is distributed under GPL-3.0-only, not via crates.io.
# Third-party dependency licensing is audited separately via deny.toml.
publish = false

[lib]
name = "foodmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
axum = "0.8"
log = "=0.4.34"
rand = "0.9"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "=0.40.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
mime_guess = "2.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-log = "=2.9.0"
tauri-plugin-opener = "=2.5.3"
thiserror = "=2.0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util", "time"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
uuid = { version = "1.20", features = ["v7"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
fs4 = "=0.13.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

[dev-dependencies]
tempfile = "=3.27.0"
