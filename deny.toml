# Stage 9 reviewed policy for the Windows release graph. Linux-only GTK
# transitive crates are excluded by the Windows target passed in the release
# command, rather than suppressed with advisory ignores.
[advisories]
version = 2
# The locked Tauri 2.11.5 toolchain reaches these unmaintained `rust-unic`
# crates through `tauri-utils -> urlpattern`; RustSec lists no safe upgrade.
# They are reviewed Windows-release transitive warnings, not a blanket class.
ignore = [
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OFL-1.1"]
confidence-threshold = 0.8

[licenses.private]
# The unpublished application crate declares GPL-3.0-only in Cargo.toml.
# This exemption applies only to workspace/private crates, never registry code.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
